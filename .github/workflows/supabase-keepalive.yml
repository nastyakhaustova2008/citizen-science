# Keeps the free Supabase project from pausing after 7 days without database activity
# (school holidays). One small real read through the Data API (PostgREST): the id of one
# published lab — public data, no personal data. See supabase/SETUP_AUTH.md → 28.
name: supabase-keepalive

on:
  schedule:
    - cron: '17 4,16 * * *'   # 04:17 and 16:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/supabase-keepalive.yml'

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one lab id through the Data API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Pasted secrets often end with a newline or spaces: strip all whitespace.
          SUPABASE_URL=$(printf '%s' "${SUPABASE_URL:-}" | tr -d '[:space:]')
          SUPABASE_ANON_KEY=$(printf '%s' "${SUPABASE_ANON_KEY:-}" | tr -d '[:space:]')
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::secret SUPABASE_URL is not set"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::secret SUPABASE_ANON_KEY is not set"
            exit 1
          fi
          # campaigns.id: anon may read it (grant in migration 010), RLS shows published labs only.
          # The key goes only in the apikey header (works for legacy anon JWTs and sb_publishable_ keys).
          # The body is discarded; only the HTTP status is printed. --fail makes non-2xx fail the job.
          status=$(curl --fail --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/campaigns?select=id&limit=1")
          echo "HTTP ${status}"
